name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "projects/frontend/**"
      - ".github/workflows/node.yml"
  pull_request:
    branches: [main]
    paths:
      - "projects/frontend/**"
      - ".github/workflows/node.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: projects/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: projects/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test