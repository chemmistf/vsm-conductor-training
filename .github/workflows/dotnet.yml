name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "projects/backend/**"
      - ".github/workflows/dotnet.yml"
  pull_request:
    branches: [main]
    paths:
      - "projects/backend/**"
      - ".github/workflows/dotnet.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: projects/backend/VSMTraining

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore VSMTraining.sln

      - name: Build
        run: dotnet build VSMTraining.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test VSMTraining.sln --configuration Release --no-build --verbosity normal